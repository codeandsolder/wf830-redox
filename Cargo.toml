[workspace]
resolver = "3"
members = [
    "crates/gct-hci",
    "crates/gct-transport",
    "crates/gct-lapi",
    "crates/gct-runtime",
    "crates/gctd",
    "crates/lted-proto",
    "crates/lted-sysv",
    "crates/lted-compat",
    "crates/lted-bridge",
]

[workspace.package]
edition = "2024"
rust-version = "1.99"
license = "GPL-2.0-only"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
