name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    uses: codeandsolder/ci-workflows/.github/workflows/rust-sccache.yml@835efeff3a1e617d8ecd40ed70b402a298d2481f # main
    with:
      rust-toolchain: "1.99.1"
      rust-components: "rustfmt clippy"
      command: |
        cargo +1.99.1 fmt --all -- --check
        git diff --check
        cargo +1.99.1 clippy --locked --workspace --all-targets --all-features -- -D warnings
        cargo +1.99.1 test --locked --workspace --all-features
        RUSTDOCFLAGS="-D warnings" cargo +1.99.1 doc --locked --workspace --all-features --no-deps
