name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  strict-rust:
    name: Strict Rust
    uses: codeandsolder/rust-skills2/.github/workflows/strict-rust.yml@6c05b0c1efa0a7a5d2cc665444ef13ece889429c # main
    with:
      cargo-args: "--locked --workspace --all-targets --all-features"

  rust-shared-sccache:
    name: Rust 1.99.1 shared sccache
    uses: codeandsolder/ci-workflows/.github/workflows/rust-sccache.yml@9be344b41c4c7e53f451d7ab1f66d7d9e7a9a6f4 # main
    with:
      rust-toolchain: "1.99.1"
      rust-components: "clippy rustfmt"
      rustflags: "-C target-cpu=x86-64-v2"
      command: >-
        cargo +1.99.1 fmt --all -- --check &&
        CARGO_BUILD_WARNINGS=deny cargo +1.99.1 check --locked --workspace --all-targets --all-features &&
        CARGO_BUILD_WARNINGS=deny cargo +1.99.1 clippy --locked --workspace --all-targets --all-features -- -D warnings &&
        cargo +1.99.1 test --locked --workspace --all-features
