name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    uses: codeandsolder/ci-workflows/.github/workflows/rust-sccache.yml@f79aef2a560a2c1c0f06f3c657f690f778040156 # main
    with:
      rust-components: "rustfmt clippy"
      command: |
        git diff --check
        cargo test --locked --workspace --all-features
        RUSTDOCFLAGS="-D warnings" cargo doc --locked --workspace --all-features --no-deps
